services:
  - type: web
    name: apg-v10
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apg-db-v10
          property: connectionString
      - key: APG_SECRET_KEY
        generateValue: true
      - key: APG_PASSWORD_SALT
        generateValue: true
      - key: APG_COOKIE_SECURE
        value: "1"

databases:
  - name: apg-db-v10
    databaseName: apg
    user: apg
